# ═══════════════════════════════════════════════════════════════
#  CHATAFT - gateway.ini (Bridge Configuration)
# ═══════════════════════════════════════════════════════════════
# Copy this file into citadel/<your-bridge-name>/gateway.ini
# and configure the platforms you want to bridge.
#
# Only include sections for the platforms you're connecting.
# A gateway with [telegram] and [discord] bridges those two.
# Add [stoatchat] or [matrix] to make it a 3-way or 4-way bridge.
#
# ── Common options (available on all platforms) ──
#
#   channel_id             Platform-specific channel/room ID
#   mode                   "both" = send & receive (default)
#                          "send" = only send FROM this platform
#                          "receive" = only receive TO this platform
#   use_prefixes           Show "[AuthorName]:" before each message (default: true)
#   collapse_prefixes      Skip prefix for consecutive messages from same user (default: false)
#   add_channel_name       Include source channel/platform name in prefix (default: false)
#   add_filenames          Include filenames when forwarding attachments (default: true)
#   ignore_bots            Ignore messages from bots (default: true)
#   ignore_text            Only bridge media, ignore text-only messages (default: false)
#   forward_member_events  Bridge join/leave system events (default: false)
#   file_size_notifications  Notify when a file exceeds platform size limit (default: true)
#   cross_edit             Sync message edits across platforms (default: true)
#   cross_delete           Sync message deletes across platforms (default: true) (doesn't work on Telegram)
#   privacy_limit          Similar option from codex.ini, but configurable per-bridge. (default: 1, unless overwritten by codex.ini)


# ───────────────────────────────────────────────────────────────
#  TELEGRAM
# ───────────────────────────────────────────────────────────────
[telegram]
# Chat ID - forward a group message to @userinfobot to get this.
# Group IDs are negative (e.g. -1001234567890).
channel_id = -100XXXXXXXXXX
mode = both

use_prefixes = true
collapse_prefixes = true
add_channel_name = true
add_filenames = true
ignore_bots = true
ignore_text = false

# Telegram topic (forum) ID - for groups that use Topics.
# Leave blank or omit for the general/default topic.
# topic_id =
# topic_label =

# Parse channel post signatures (admin names on forwarded channel posts).
# false/0 = disabled
# true/1  = resolve admin avatars (default)
# 2       = also use channel profile picture for bot signatures
# parse_channel_signatures = true


# ───────────────────────────────────────────────────────────────
#  DISCORD
# ───────────────────────────────────────────────────────────────
[discord]
# Channel ID - enable Developer Mode (Settings → Advanced),
# then right-click channel → Copy Channel ID.
channel_id = XXXXXXXXXXXXXXXXXX
mode = both

# ── Webhook settings ──
# Webhooks make bridged messages show the original user's name & avatar.
# Highly recommended. Without webhooks, everything comes from the bot.
use_webhooks = true

# Create a webhook: Channel Settings → Integrations → Webhooks → New Webhook
webhook_url = https://discord.com/api/webhooks/XXXXX/XXXXX

# Append source platform/channel name to the webhook username
# e.g. "John (#telegram)" instead of "John"
webhook_add_channel_in_name = true

# Append forward indicator to webhook name for forwarded messages
webhook_forward_in_name = true

# Show "Forwarded from:" label on forwarded messages
webhook_show_forwards = true

# Use message link instead of Discord's native reply for webhooks.
# Discord doesn't support replies from webhooks, so this posts a link
# to the original message as a workaround.
webhook_bypass_reply = true

# Ignore messages sent by other webhooks (prevents echo loops)
ignore_webhooks = true

use_prefixes = true
add_channel_name = false
add_filenames = true
ignore_bots = true
ignore_text = false


# ───────────────────────────────────────────────────────────────
#  STOATCHAT
# ───────────────────────────────────────────────────────────────
[stoatchat]
channel_id = XXXXXXXXXXXXXXXXXXXXXXXXXX
mode = both

# Masquerade makes bridged messages appear as the original user
# (their name and avatar), similar to Discord webhooks.
use_masquerade = true

# Override the masquerade display colour (hex, e.g. "#FF5733").
# Leave blank for the platform default.
# masquerade_colour =

# StoatChat API base URL
api_url = https://stoat.chat/api

# Ignore messages from the bot's own account (prevents echo loops)
ignore_self = true

use_prefixes = true
add_filenames = false
ignore_bots = true
ignore_text = false


# ───────────────────────────────────────────────────────────────
#  MATRIX
# ───────────────────────────────────────────────────────────────
[matrix]
# Room ID - find it in Element: Room Settings → Advanced → Internal room ID
# Format: !AbCdEfG:matrix.org
channel_id = !XXXXXXXXXX:matrix.org
mode = both

# Use ghost/puppet users for bridged messages.
# Requires AppService mode configured in codex.ini.
# When false, all messages come from the bot with author prefixes.
use_ghosts = false

# Optional human-readable room alias
# room_alias = #my-room:matrix.org

use_prefixes = true
collapse_prefixes = true
add_channel_name = true
add_filenames = true
ignore_bots = true
ignore_text = false


# ───────────────────────────────────────────────────────────────
#  IMPORT SETTINGS (chat history migration)
# ───────────────────────────────────────────────────────────────
# One-time settings for exporting/importing chat history.
# Uncomment, place to the platform FROM where you want to export messages
#
# import_start = messagelink    
# import_end = messagelink		# Optional
# import_receiver = true        # Set to true on the platform receiving the import
