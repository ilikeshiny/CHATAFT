#  CHATAFT - codex.ini (Global Configuration)

# Copy this file to codex.ini and fill in your values.
# Only fill in tokens for the platforms you want to use.
# Lines starting with # are comments.

[Credentials]

# ── Discord ──
# Bot token: Discord Developer Portal → Your App → Bot → Reset Token
# https://discord.com/developers/applications
# If you want to enter clientbot mode, uncomment the discord_mode line
discord_token =

# Bot's application ID: Developer Portal → Your App → General Information → Application ID
discord_bot_id =

# ── Telegram ──
# Bot token: message @BotFather on Telegram → /newbot
# https://t.me/BotFather
telegram_bot_token =

# ── StoatChat ──
# Bot token from StoatChat bot management
stoatchat_token =

# ── Matrix (Bot mode - for matrix.org or any homeserver without admin) ──
matrix_homeserver_url = https://matrix-client.matrix.org
matrix_bot_user = @YOURBOTNAME:matrix.org
# Username can be the localpart or full mxid. Required for auto-login on MAS-backed
# homeservers (e.g. matrix.org) where access tokens auto-expire and need refresh tokens.
matrix_bot_username =
matrix_bot_password =

# Optional: a one-shot access token. Used only to bootstrap the very first session when no
# saved session exists. After that, the bot manages its own tokens via citadel/_global/matrix_session.json.
# matrix_bot_token =

[Features]

# ── Logging ──
# Logging level: DEBUG, INFO, WARNING, ERROR
# Use DEBUG while setting up, switch to INFO once everything works.
log_level = INFO

# ── Queue Namespace ──
# Allows multiple CHATAFT instances to share one RabbitMQ server.
# Each instance should use a unique namespace. Queues will be prefixed
# with this value (e.g. "prod_scribe_discord", "prod_pilgrim_telegram").
queue_namespace = prod

# Discord mode of operation
# Uncomment line below if you want to use clientbot mode
# Make sure to paste the user token in discord_token
# Discord clientbots violate Discord's TOS!
# Discord clientbots cannot upload any attachments!
# Behavior defaults to read-only unless you have a valid webhook_url in gateway.ini
# discord_mode = clientbot

# ── Privacy Limit ──
# Sets the maximum privacy level a user can set
# 0 = disabled, 1 = omit nicknames, 2 = ignore user completely
# Fully revertable
# Default is 1

privacy_limit = 1

cache_dir = cache

# ── RabbitMQ ──
# Connection settings for your RabbitMQ instance.
# Default port is 5672. Change if you configured a different port.
# Values entered below are default, and should work OOTB after install.
# Recommended to change the port if running with a white IP
rabbitmq_host = localhost
rabbitmq_port = 5672
rabbitmq_user = Guest
rabbitmq_pass = Guest

# ── Avatar Upload Channels ──
# CHATAFT mirrors user avatars across platforms. To do this, it needs a
# channel on each platform where it can upload avatar images to get CDN URLs.
# Create a private/unused channel on each platform and paste the ID here.

# Discord: create a private channel → right-click → Copy Channel ID
# Can work with a user DM
discord_avatar_upload_channel_id =

# StoatChat: create a private channel and paste its ID here
# Can Work with a user DM
stoatchat_avatar_upload_channel_id =


[Arbiter]

# Pin the live dashboard to the top of the terminal (uses Rich library).
# Set to false for headless/log-only mode.
auto_dashboard_pin = true

# Headless mode - Will send plain text with no Rich requirement. 
arbiter_headless = false

# Maintenance
auto_restart_timer = 72        # hours between cycles; 0 or blank = disabled
auto_restart_clear_msg = 15    # minutes of idle required before restarting
auto_restart_max_wait = 6     # hours; after this we force-restart even if busy